# laplust.com 配信設定（さくらVPS / nginx）
# 配置先: /etc/nginx/sites-available/laplust.conf（sites-enabledへシンボリックリンク）
# redirect-map.conf は /etc/nginx/conf.d/ に配置すること（http コンテキストで読み込まれる）
#
# Netlifyで提供していた機能の置き換え:
# - http→https / www→apex の301
# - 旧サイト大文字URL64件の301（redirect-map.conf）
# - 末尾スラッシュの正規化（/company/ → /company）
# - /assets/ と /images/posters/ の1年immutableキャッシュ
# - 404.html の配信

# HTTP: Let's Encrypt検証以外はすべてHTTPSへ
server {
    listen 80;
    listen [::]:80;
    server_name laplust.com www.laplust.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://laplust.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.laplust.com;

    ssl_certificate     /etc/letsencrypt/live/laplust.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laplust.com/privkey.pem;

    return 301 https://laplust.com$request_uri;
}

# 本体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laplust.com;

    ssl_certificate     /etc/letsencrypt/live/laplust.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laplust.com/privkey.pem;

    root /var/www/laplust;
    index index.html;
    error_page 404 /404.html;

    # 旧サイトの大文字URL → 小文字URL（redirect-map.conf で定義）
    if ($laplust_redirect != "") {
        return 301 $laplust_redirect;
    }

    # 末尾スラッシュを除去（/company/ → /company。トップは除く）
    rewrite ^/(.+)/$ /$1 permanent;

    # 圧縮転送（帯域削減）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # ハッシュ付きファイル名のアセットは1年キャッシュ（再訪問時のDLゼロ）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /images/posters/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js静的出力: /company → company.html の解決
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
